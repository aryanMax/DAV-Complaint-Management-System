{% extends "complaints/base.html" %}
{% block title %}Admin Dashboard | DAV Portal{% endblock %}

{% block content %}
    <h2 style="margin-top: 0; font-weight: 400;">System Overview - <span style="color: var(--accent); font-weight: bold;">Administrator</span></h2>
    <hr style="border-color: var(--border); margin-bottom: 30px;">

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total System Complaints</h3>
            <p class="number">{{ total }}</p>
        </div>
        <div class="stat-card">
            <h3>Pending Review</h3>
            <p class="number" style="color: #fcd34d;">{{ pending }}</p>
        </div>
        <div class="stat-card">
            <h3>Resolved Issues</h3>
            <p class="number" style="color: #6ee7b7;">{{ resolved }}</p>
        </div>
    </div>

    <a href="{% url 'all_complaints' %}" class="action-btn">Review Complaint Database</a>
{% endblock %}
