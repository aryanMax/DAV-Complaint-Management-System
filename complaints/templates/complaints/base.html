<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Complaint Resolution Portal{% endblock %}</title>
    <style>
        :root {
            --bg-deep: #0b1120;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background-color: var(--bg-deep);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }
        .brand {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            padding: 0 20px 30px 20px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            line-height: 1.4;
            text-transform: uppercase;
        }
        .nav-link {
            padding: 12px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            display: block;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: var(--text-main);
            background-color: rgba(16, 185, 129, 0.05);
            border-left-color: var(--accent);
        }
        .logout-container {
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        .logout-btn {
            width: 100%;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .action-btn {
            background-color: var(--accent);
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }
        .action-btn:hover { background-color: var(--accent-hover); }

        input, select, textarea {
            background-color: var(--bg-deep);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .status { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.PENDING { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status.IN_PROGRESS { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
        .status.RESOLVED { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">Complaint Resolution Portal</div>
        
        <a href="{% url 'dashboard' %}" class="nav-link">Dashboard</a>
        
        {% if request.user.is_authenticated %}
            {% if request.user.is_staff %}
                <a href="{% url 'all_complaints' %}" class="nav-link">All Complaints</a>
                <a href="{% url 'notice_board' %}" class="nav-link">📢 Notice Board</a>
                <a href="{% url 'publish_notice' %}" class="nav-link" style="color: var(--accent);">+ Publish Notice</a>
            {% else %}
                <a href="{% url 'create_complaint' %}" class="nav-link">File Complaint</a>
                <a href="{% url 'my_complaints' %}" class="nav-link">My Complaints</a>
                <a href="{% url 'notice_board' %}" class="nav-link">📢 Notice Board</a>
            {% endif %}
        {% endif %}

        <div class="logout-container">
