{% extends 'complaints/base.html' %}
{% block title %}Publish Notice{% endblock %}

{% block content %}
<div style="max-width: 600px; background: var(--bg-card); padding: 35px; border-radius: 8px; border: 1px solid var(--border);">
    <h2 style="margin-top: 0; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 12px;">Publish College Announcement</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;">Announcement Title</label>
            {{ form.title }}
        </div>
        <div style="margin-bottom: 30px;">
            <label style="display: block; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;">Full Details</label>
            {{ form.content }}
        </div>

        <div style="display: flex; gap: 15px;">
            <button type="submit" class="action-btn" style="flex: 1;">Broadcast Notice</button>
            <a href="{% url 'notice_board' %}" class="action-btn" style="flex: 1; text-align: center; background: var(--bg-deep); color: var(--text-main); border: 1px solid var(--border);">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
